# SonarQube/SonarCloud Configuration — Crypto Intelligence Platform (Multi-Module)
# Docs: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=jeffesa_crypto-intelligence-plataform
sonar.organization=jeffesa
sonar.projectName=Crypto Intelligence Platform
sonar.host.url=https://sonarcloud.io

# Source and tests
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/target/**,**/node_modules/**,**/docs/**,**/.github/**,**/infra/**

# Module list (added as modules are created - see TASK-001)
sonar.modules=identity,market-data,news-intelligence,social-intelligence,ai-engine,historical-data,strategy-engine,trading-engine,risk-management,backtesting,portfolio,notification,reporting

# Coverage (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,*/target/site/jacoco/jacoco.xml

# Quality Gate thresholds (see .github/workflows/ci-cd.yml)
sonar.qualitygate.wait=true

# Duplication exclusions
sonar.cpd.exclusions=**/*.sql,**/*Test.java,**/*Tests.java

# Encoding
sonar.sourceEncoding=UTF-8